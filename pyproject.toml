[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nju-coding-agent-harness"
version = "0.1.2"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "requests",
    "mcp",
    "keyring",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cah = "harness.main:main"

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
addopts = "-q"
